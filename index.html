<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mai Việt Contacts</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <style>
    /* =========================
      FILE: style.css
      ========================= */

      *{
        margin:0;
        padding:0;
        box-sizing:border-box;
      }

      body{
        font-family:Arial, sans-serif;
        display:flex;
        background:#f4f6f9;
        height:100vh;
      }

      /* SIDEBAR */

      .sidebar{
        width:260px;
        background:#1f2937;
        color:white;
        transition:0.3s;
        overflow:auto;
      }

      .logo{
        padding:20px;
        font-size:20px;
        font-weight:bold;
        border-bottom:1px solid rgba(255,255,255,0.1);

        display:flex;
        gap:10px;
        align-items:center;
      }

      .menu-toggle{
        display:none;
      }

      .menu{
        padding:10px;
      }

      .menu-item{
        margin-bottom:10px;
      }

      .menu-header{
        display:flex;
        justify-content:space-between;
        padding:12px;
        cursor:pointer;
        border-radius:10px;
        background:rgba(255,255,255,0.05);
      }

      .submenu{
        display:none;
        padding-left:10px;
      }

      .submenu a{
        display:block;
        color:white;
        text-decoration:none;
        padding:10px;
        border-radius:8px;
      }

      .submenu a:hover{
        background:rgba(255,255,255,0.1);
      }

      .menu-link{
        display:flex;
        gap:10px;
        padding:12px;
        margin-top:10px;
        cursor:pointer;
        border-radius:10px;
      }

      .menu-link:hover{
        background:rgba(255,255,255,0.1);
      }

      /* MAIN */

      .main{
        flex:1;
        overflow:auto;
        padding:20px;
      }

      .topbar{
        display:flex;
        gap:10px;
        margin-bottom:20px;
      }

      .topbar input{
        flex:1;
        padding:12px;
        border:none;
        border-radius:10px;
      }

      .add-btn{
        border:none;
        background:#2563eb;
        color:white;
        padding:12px 18px;
        border-radius:10px;
        cursor:pointer;
      }

      /* CONTACT GRID */

      .contact-grid{
        display:grid;
        grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
        gap:15px;
      }

      .card{
        background:white;
        border-radius:15px;
        padding:20px;
        box-shadow:0 2px 8px rgba(0,0,0,0.08);
      }

      .card h3{
        margin-bottom:10px;
      }

      .card p{
        margin:6px 0;
        color:#444;
      }

      .badge{
        display:inline-block;
        background:#2563eb;
        color:white;
        padding:5px 10px;
        border-radius:20px;
        font-size:12px;
        margin-top:10px;
      }

      .actions{
        margin-top:15px;
        display:flex;
        flex-wrap:wrap;
        gap:10px;
      }

      .actions button,
      .actions a{
        text-decoration:none;
        border:none;
        padding:10px 12px;
        border-radius:8px;
        cursor:pointer;
        color:white;
      }

      .call-btn{
        background:#16a34a;
      }

      .zalo-btn{
        background:#0284c7;
      }

      .edit-btn{
        background:#f59e0b;
      }

      .delete-btn{
        background:#dc2626;
      }

      /* MODAL */

      .modal{
        position:fixed;
        inset:0;
        background:rgba(0,0,0,0.4);
        display:none;
        justify-content:center;
        align-items:center;
        padding:20px;
      }

      .modal-content{
        background:white;
        width:100%;
        max-width:500px;
        border-radius:20px;
        padding:20px;
      }

      .modal-header{
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:20px;
      }

      .close-btn{
        border:none;
        background:none;
        font-size:22px;
        cursor:pointer;
      }

      .form-group{
        margin-bottom:15px;
      }

      .form-group label{
        display:block;
        margin-bottom:8px;
      }

      .form-group input,
      .form-group select,
      .form-group textarea{
        width:100%;
        padding:12px;
        border:1px solid #ddd;
        border-radius:10px;
      }

      .save-btn{
        width:100%;
        border:none;
        background:#2563eb;
        color:white;
        padding:14px;
        border-radius:10px;
        cursor:pointer;
      }

      /* MOBILE */

      .mobile-menu-btn{
        display:none;
      }

      @media(max-width:768px){

        .sidebar{
          position:fixed;
          left:-260px;
          top:0;
          bottom:0;
          z-index:1000;
        }

        .sidebar.active{
          left:0;
        }

        .mobile-menu-btn{
          display:block;
          border:none;
          padding:12px;
          border-radius:10px;
        }

        .topbar{
          flex-wrap:wrap;
        }

      }
  </style>

</head>
<body>

<div class="sidebar" id="sidebar">
  <div class="logo">
    <i class="fa-solid fa-address-book"></i>
    <span>Mai Việt Contacts</span>
  </div>

  <button class="menu-toggle" onclick="toggleSidebar()">
    <i class="fa-solid fa-bars"></i>
  </button>

  <div class="menu">
    <div class="menu-item">
      <div class="menu-header" onclick="toggleSubmenu(this)">
        <span><i class="fa-solid fa-layer-group"></i> Chọn Trang Tính (Sheet)</span>
        <i class="fa-solid fa-chevron-down"></i>
      </div>
      <div class="submenu" id="sheetMenu" style="display: block;">
        </div>
    </div>

    <div class="menu-link" onclick="openModal()">
      <i class="fa-solid fa-user-plus"></i>
      <span>Thêm liên hệ</span>
    </div>

    <div class="menu-link" onclick="loadContacts()">
      <i class="fa-solid fa-rotate"></i>
      <span>Làm mới</span>
    </div>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <button class="mobile-menu-btn" onclick="toggleSidebar()">
      <i class="fa-solid fa-bars"></i>
    </button>

    <h2 id="currentSheetTitle" style="font-size: 1.1rem; color: #2c3e50; margin-right: 10px;">Sheet: 1</h2>

    <input type="text" id="searchInput" placeholder="Tìm kiếm tên hoặc số điện thoại..."/>

    <button class="add-btn" onclick="openModal()">
      <i class="fa-solid fa-plus"></i> Thêm
    </button>
  </div>

  <div id="contactList" class="contact-grid"></div>
</div>

<div class="modal" id="contactModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalTitle">Thêm liên hệ</h2>
      <button class="close-btn" onclick="closeModal()">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="form-group">
      <label>Họ tên</label>
      <input type="text" id="name"/>
    </div>

    <div class="form-group">
      <label>Số điện thoại</label>
      <input type="text" id="phone"/>
    </div>

    <div class="form-group">
      <label>Ghi chú</label>
      <textarea id="note"></textarea>
    </div>

    <button class="save-btn" onclick="saveContact()">Lưu liên hệ</button>
  </div>
</div>

<script>
    // =================================
    // THAY LINK APPS SCRIPT CỦA BẠN VÀO ĐÂY
    // =================================
    const API_URL = "https://script.google.com/macros/s/AKfycbxAbzBFk0SqmG91YZUnwXYWaNUnbU3ASwXHkUGDKi1RmqYdKkInQBBZ9xg59YO69xFZKg/exec";

    let contacts = [];
    let editingId = null;
    let currentSheet = "1"; // Mặc định ban đầu tải dữ liệu từ Sheet 1

    /* =========================
       KHỞI TẠO MENU 10 SHEET
       ========================= */
    function initSheetMenu() {
      const menuContainer = document.getElementById("sheetMenu");
      menuContainer.innerHTML = "";
      
      // Vòng lặp tạo từ danh mục từ sheet 1 đến sheet 10
      for (let i = 1; i <= 10; i++) {
        const a = document.createElement("a");
        a.href = "#";
        a.innerText = `Trang tính ${i}`;
        a.id = `sheet-btn-${i}`;
        if (String(i) === currentSheet) a.classList.add("active"); // Đánh dấu sheet hiện tại
        
        a.onclick = function (e) {
          e.preventDefault();
          changeSheet(String(i));
        };
        menuContainer.appendChild(a);
      }
    }

    // Hàm chuyển đổi giữa các sheet
    async function changeSheet(sheetName) {
      currentSheet = sheetName;
      document.getElementById("currentSheetTitle").innerText = `Sheet: ${sheetName}`;
      
      // Cập nhật lại class active trên menu
      for (let i = 1; i <= 10; i++) {
        const btn = document.getElementById(`sheet-btn-${i}`);
        if (btn) {
          if (String(i) === sheetName) btn.classList.add("active");
          else btn.classList.remove("active");
        }
      }
      
      await loadContacts();
    }

    /* =========================
       TẢI LIÊN HỆ TỪ API
       ========================= */
    async function loadContacts() {
      const list = document.getElementById("contactList");
      list.innerHTML = `<h3><i class="fa-solid fa-spinner fa-spin"></i> Đang tải dữ liệu Sheet ${currentSheet}...</h3>`;
      
      try {
        // Truyền thêm tham số ?sheet= để backend biết cần lấy dữ liệu từ sheet nào
        const res = await fetch(`${API_URL}?sheet=${currentSheet}`);
        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
        contacts = await res.json();
        renderContacts(contacts);
      } catch (err) {
        list.innerHTML = `<h3 style="color:red;">Không tải được dữ liệu từ Sheet ${currentSheet}</h3>`;
        console.error(err);
      }
    }

    /* =========================
       HIỂN THỊ DANH SÁCH RA WEB
       ========================= */
    function renderContacts(data) {
      const list = document.getElementById("contactList");
      list.innerHTML = "";

      if (!data || data.length === 0) {
        list.innerHTML = `<h3>Trang tính này chưa có dữ liệu danh bạ</h3>`;
        return;
      }

      // Khớp chính xác với cấu trúc cột: id, name, phone, note trên Sheet của bạn
      const html = data.map(item => `
        <div class="card">
          <h3><i class="fa-solid fa-user"></i> ${escapeHtml(item.name || "Không rõ tên")}</h3>
          <p class="phone-number">
            <i class="fa-solid fa-phone"></i> <strong>${escapeHtml(item.phone || "")}</strong>
          </p>
          <p class="note-box">
            <i class="fa-solid fa-comment-dots"></i> ${escapeHtml(item.note || "---")}
          </p>
          <div class="actions">
            <a class="call-btn" href="tel:${escapeHtml(item.phone)}">
              <i class="fa-solid fa-phone-flip"></i> Gọi điện
            </a>
            <a class="zalo-btn" target="_blank" href="https://zalo.me/${escapeHtml(item.phone)}">
              <i class="fa-solid fa-message"></i> Zalo
            </a>
            <button class="edit-btn" onclick="editContact(${item.id})">
              <i class="fa-solid fa-pen"></i> Sửa
            </button>
            <button class="delete-btn" onclick="deleteContact(${item.id})">
              <i class="fa-solid fa-trash"></i> Xóa
            </button>
          </div>
        </div>
      `).join("");

      list.innerHTML = html;
    }

    function escapeHtml(text) {
      if (!text) return "";
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    /* =========================
       TÌM KIẾM LIÊN HỆ
       ========================= */
    document.getElementById("searchInput").addEventListener("input", function() {
      const value = this.value.toLowerCase().trim();

      if (!value) {
        renderContacts(contacts);
        return;
      }

      const filtered = contacts.filter(item => {
        return (
          (item.name && item.name.toLowerCase().includes(value)) ||
          (item.phone && item.phone.includes(value)) ||
          (item.note && item.note.toLowerCase().includes(value))
        );
      });

      renderContacts(filtered);
    });

    /* =========================
       LƯU LIÊN HỆ (THÊM / SỬA)
       ========================= */
    async function saveContact() {
      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const note = document.getElementById("note").value.trim();

      if (!name) {
        alert("Vui lòng nhập họ tên");
        return;
      }
      if (!phone) {
        alert("Vui lòng nhập số điện thoại");
        return;
      }

      const data = {
        action: editingId ? "update" : "create",
        id: editingId,
        sheet: currentSheet, // Gửi kèm thông tin sheet hiện tại lên để lưu đúng chỗ
        name,
        phone,
        note
      };

      try {
        const saveBtn = document.querySelector(".save-btn");
        saveBtn.innerText = "Đang xử lý...";
        saveBtn.disabled = true;

        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(data)
        });

        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);

        closeModal();
        await loadContacts();
      } catch (err) {
        alert("Lỗi khi kết nối đến Google Sheet!");
        console.error(err);
      } finally {
        const saveBtn = document.querySelector(".save-btn");
        saveBtn.innerText = "Lưu liên hệ";
        saveBtn.disabled = false;
      }
    }

    /* =========================
       CÁC HÀM ĐIỀU KHIỂN GIAO DIỆN MODAL/MENU
       ========================= */
    function editContact(id) {
      const item = contacts.find(x => x.id == id);
      if (!item) return;

      editingId = id;
      document.getElementById("modalTitle").innerText = "Sửa liên hệ";
      document.getElementById("name").value = item.name || "";
      document.getElementById("phone").value = item.phone || "";
      document.getElementById("note").value = item.note || "";
      document.getElementById("contactModal").style.display = "flex";
    }

    async function deleteContact(id) {
      if (!confirm("Bạn chắc chắn muốn xóa liên hệ này trên Sheet " + currentSheet + "?")) return;

      try {
        await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "delete",
            id: id,
            sheet: currentSheet
          })
        });
        await loadContacts();
      } catch (err) {
        alert("Không thể xóa dữ liệu");
        console.error(err);
      }
    }

    function openModal() {
      editingId = null;
      document.getElementById("modalTitle").innerText = "Thêm liên hệ vào Sheet " + currentSheet;
      document.getElementById("name").value = "";
      document.getElementById("phone").value = "";
      document.getElementById("note").value = "";
      document.getElementById("contactModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("contactModal").style.display = "none";
    }

    function toggleSubmenu(el) {
      const submenu = el.nextElementSibling;
      submenu.style.display = submenu.style.display === "block" ? "none" : "block";
    }

    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("active");
    }

    /* =========================
       CHẠY ỨNG DỤNG
       ========================= */
    initSheetMenu();
    loadContacts();
</script>
</body>
</html>
